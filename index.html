<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SoloWrite AI</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; height: 650px; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #007bff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1em; box-sizing: border-box; }
        .header-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
        .header-buttons { display: flex; gap: 5px; flex-shrink: 0; }
        .header-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 8px; border-radius: 5px; cursor: pointer; font-size: 0.7em; font-weight: normal; transition: background 0.2s; }
        .header-btn:hover { background: rgba(255,255,255,0.4); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .message { padding: 10px 14px; border-radius: 18px; max-width: 80%; word-wrap: break-word; font-size: 0.95em; }
        .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #e4e6eb; color: black; align-self: flex-start; border-bottom-left-radius: 2px; }
        .bot img { width: 100%; border-radius: 10px; margin-top: 8px; display: block; background: #ccc; min-height: 150px; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #e4e6eb; background: #fff; }
        .chat-input { flex: 1; padding: 10px; border: 1px solid #ccd0d5; border-radius: 20px; outline: none; padding-left: 15px; }
        .chat-submit { background: #007bff; color: white; border: none; padding: 0 15px; margin-left: 8px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .chat-submit:hover { background: #0056b3; }
        .stats { font-size: 0.75em; color: #65676b; text-align: center; padding: 5px; background: #f8f9fa; border-top: 1px solid #e4e6eb; }
        #fileInput { display: none; }
    </style>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="header-title">SoloWrite 🎨</div>
        <div class="header-buttons">
            <button class="header-btn" id="downloadNewVersion" title="Скачать самую новую версию">🆕 Скачать</button>
            <button class="header-btn" id="downloadBrain" title="Скачать базу знаний в JSON">📥 Скачать</button>
            <button class="header-btn" id="uploadTrigger" title="Загрузить базу знаний из JSON">📤 Загрузить</button>
            <button class="header-btn" id="clearMemory" title="Стереть всю память">🗑️ Сброс</button>
        </div>
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="stats" id="stats">Изучено слов: 0 | Связей: 0 </div>
    <div class="chat-input-area">
        <input type="text" id="input" class="chat-input" placeholder="Введите фразу..." autocomplete="off">
        <button id="send" class="chat-submit">Отправить</button>
    </div>
</div>

<input type="file" id="fileInput" accept=".json">

<script>
    // Разум v2: цепь Маркова по парам слов (t2) + запасная по одному слову (t1)
    const START = '<s>', END = '<e>';
    let brain = { v: 2, t1: {}, t2: {} };

    function applyBrain(p) {
        if (p && p.v === 2) {
            brain = { v: 2, t1: p.t1 || {}, t2: p.t2 || {} };
        } else {
            // старый brain.json (одно слово) переносим в t1
            brain = { v: 2, t1: (p && (p.t || p.transitions)) || {}, t2: {} };
        }
    }

    function loadBrain() {
        const savedBrain = localStorage.getItem('ai_brain_memory');
        if (savedBrain) {
            try {
                applyBrain(JSON.parse(savedBrain));
            } catch (e) {
                console.error(e);
            }
        }
        updateStats();
    }

    function saveBrain() {
        try {
            localStorage.setItem('ai_brain_memory', JSON.stringify(brain));
        } catch (e) {
            console.warn('Память браузера переполнена, скачай brain.json', e);
        }
    }

    document.getElementById('downloadBrain').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(brain)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "brain.json";
        a.click();
        URL.revokeObjectURL(a.href);
    });
    document.getElementById('downloadNewVersion').addEventListener('click', () => {
    // Готовая база знаний для новой версии
    const newBrain = {
        "v": 2,
        "t1": {
            "<s>": {
                "привет": 1
            },
            "привет": {
                "привет": 1,
                "<e>": 1
            }
        },
        "t2": {
            "<s>|<s>": {
                "привет": 1
            },
            "<s>|привет": {
                "привет": 1
            },
            "привет|привет": {
                "<e>": 1
            }
        }
    };

    // Создаём файл для скачивания, не меняя память ИИ
    const blob = new Blob(
        [JSON.stringify(newBrain)],
        { type: 'application/json' }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download = 'brain.json';

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
});

    document.getElementById('uploadTrigger').addEventListener('click', () => document.getElementById('fileInput').click());

    document.getElementById('fileInput').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                applyBrain(JSON.parse(e.target.result));
                saveBrain(); updateStats(); location.reload();
            } catch (err) { alert('Ошибка: Файл поврежден или это не JSON.'); }
        };
        reader.readAsText(file);
    });

    document.getElementById('clearMemory').addEventListener('click', () => {
        if (confirm('Стереть память ИИ?')) {
            localStorage.removeItem('ai_brain_memory');
            brain = { v: 2, t1: {}, t2: {} };
            updateStats(); location.reload();
        }
    });

    // ---------- обучение ----------
    function tokenize(text) {
        return text.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').split(/\s+/).filter(w => w.length > 0);
    }

    function splitSentences(text) {
        return text.split(/[.!?…]+|\n+/).map(tokenize).filter(w => w.length > 0);
    }

    function bump(table, key, next) {
        if (!table[key]) table[key] = {};
        table[key][next] = (table[key][next] || 0) + 1;
    }

    function trainWords(words) {
        const seq = [START, START, ...words, END];
        for (let i = 1; i < seq.length - 1; i++) bump(brain.t1, seq[i], seq[i + 1]);
        for (let i = 2; i < seq.length; i++) bump(brain.t2, seq[i - 2] + '|' + seq[i - 1], seq[i]);
    }

    function train(text) {
        const sentences = splitSentences(text);
        sentences.forEach(trainWords);
        if (sentences.length) { updateStats(); saveBrain(); }
    }

    // ---------- генерация ----------
    function pickNext(options, used) {
        const keys = Object.keys(options).filter(w => w === END || (used[w] || 0) < 2);
        if (keys.length === 0) return null;
        const total = keys.reduce((s, w) => s + options[w], 0);
        let r = Math.random() * total;
        for (const w of keys) { r -= options[w]; if (r <= 0) return w; }
        return keys[keys.length - 1];
    }

    function generateOnce(seed) {
        let a = START, b = START;
        const out = [], used = {};
        let ended = false;
        if (seed) { out.push(seed); used[seed] = 1; b = seed; }
        for (let i = 0; i < 25; i++) {
            const opts = brain.t2[a + '|' + b] || brain.t1[b];
            if (!opts) break;
            const next = pickNext(opts, used);
            if (!next) break;
            if (next === END) { ended = true; break; }
            out.push(next);
            used[next] = (used[next] || 0) + 1;
            a = b; b = next;
        }
        return { out, ended };
    }

    function generateResponse(userText) {
        if (Object.keys(brain.t1).length === 0) return { text: "..." };
        const keywords = [...new Set(tokenize(userText))].filter(w => w.length > 2 && brain.t1[w]);

        // 12 вариантов, берём лучший
        let best = null, bestScore = -Infinity;
        for (let i = 0; i < 12; i++) {
            const seed = (i % 2 === 1 && keywords.length) ? keywords[Math.floor(Math.random() * keywords.length)] : null;
            const cand = generateOnce(seed);
            const hits = keywords.filter(k => cand.out.includes(k)).length;
            let score = hits * 3 + (cand.ended ? 2 : 0) + Math.min(cand.out.length, 12) / 6 + Math.random() * 0.5;
            if (cand.out.length < 3) score -= 5;
            if (score > bestScore) { bestScore = score; best = cand; }
        }

        if (!best || best.out.length === 0) return { text: "..." };
        let text = best.out.join(' ');
        text = text.charAt(0).toUpperCase() + text.slice(1) + (best.ended ? '.' : '...');
        return { text };
    }

    function updateStats() {
        const wordsCount = Object.keys(brain.t1).filter(w => w !== START).length;
        let linksCount = 0;
        for (const k in brain.t2) linksCount += Object.keys(brain.t2[k]).length;
        document.getElementById('stats').innerText = `Слов: ${wordsCount} | Связей: ${linksCount}`;
    }

    // ---------- чат (как было) ----------
    const messagesContainer = document.getElementById('messages');
    const inputField = document.getElementById('input');

    function addMessage(htmlContent, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.innerHTML = htmlContent;
        messagesContainer.appendChild(msgDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function handleSend() {
        const text = inputField.value.trim();
        if (!text) return;

        const safeText = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        addMessage(safeText, 'user');
        inputField.value = '';

        // длинный текст (энциклопедия) сначала изучаем, потом отвечаем по нему;
        // короткую фразу сначала отвечаем, потом учимся
        const isLong = tokenize(text).length > 30;
        if (isLong) train(text);
        const response = generateResponse(text);

        setTimeout(() => {
            addMessage(response.text, 'bot');
            if (!isLong) train(text);
        }, 600);
    }

    document.getElementById('send').addEventListener('click', handleSend);
    inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

    loadBrain();
</script>

</body>
</html>
